name: Update spread chart

on:
  schedule:
    - cron: "17 7 * * 1-5"
  workflow_dispatch:          # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          CS_BTP_BUND_API_KEY: ${{ secrets.CS_BTP_BUND_API_KEY }}

      - name: Save updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add BTP-Bund.png
          git diff --staged --quiet || git commit -m "Update spread chart"
          git push
